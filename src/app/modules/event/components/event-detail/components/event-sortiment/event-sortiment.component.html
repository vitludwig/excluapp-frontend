<p-inputGroup class="mb-2">
	<p-dropdown
		[options]="$options()"
		[(ngModel)]="selectedSortiment"
		(ngModelChange)="propagateSortiment($event)"
		optionLabel="name"
		[filter]="true"
		[filterFields]="['name', 'sourceName']"
		[showClear]="true"
		ariaFilterLabel=""
		[placeholder]="$label()"
		[style]="{ width: '100%' }"
		appendTo="body"
	>
		<ng-template pTemplate="selectedItem">
			@if (selectedSortiment) {
				<div class="flex align-items-center gap-2">
					<div>{{ selectedSortiment.name }} ({{ selectedSortiment.volume }}l)</div>
				</div>
			}
		</ng-template>

		<ng-template
			let-item
			pTemplate="item"
		>
			<div class="flex align-items-center justify-content-between gap-2">
				<div>{{ item.name }} ({{ item.sourceName }}) - {{ item.volume }}l</div>
				<div><button pButton>{{ $dropdownSelectButtonText() }}</button></div>
			</div>
		</ng-template>
	</p-dropdown>
</p-inputGroup>
